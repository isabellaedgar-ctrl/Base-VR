<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Isabella VR</title>
 <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
 <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
</head>
<body>
    <a-scene>
        <a-entity environment="preset: forest; skyType: gradient; horizonColor: #E5E7D6; dressingAmount: 50; skyColor: #FFA69E; dressingColor: #7A5C58; dressing:mushrooms; dressingScale: 1; groundColor: #7A5C58; groundColor2: #FFA69E"></a-entity>
        <!-- Museum floor starts here -->
         <a-cylinder id="floor" position="0 0 0" radius="7.5" color="#7A5C58" height="0.1"></a-cylinder>
         <a-box id="box1" position="0 1.473 4.907" rotation="0 0 0" scale="10 3 0.2" color="red"></a-box>
         <a-box id="box1" position="0 1.473 -4.907" rotation="0 0 0" scale="10 3 0.2" color="red"></a-box>
         <a-box id="box1" position="5.049 1.454 -0.008" rotation="0 -90 0" scale="10 3 0.2" color="red"></a-box>
         <a-box id="box1" position="0 0 0" rotation="0 0 0" scale="10 3 0.2" color="red"></a-box>
    </a-scene>
</body>
</html>
