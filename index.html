<!DOCTYPE html>
<html lang="en">

<head>
    <script src="script.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Isabella VR</title>
 <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
 <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
</head>
<body>
    <a-scene>
        <a-entity environment="preset: forest; skyType: gradient; horizonColor: #E5E7D6; dressingAmount: 100; skyColor: #FFA69E; dressingColor: #7A5C58; dressing:mushrooms; dressingScale: 1; groundColor: #7A5C58; groundColor2: #FFA69E"></a-entity>
        <!-- Museum floor starts here -->
         <a-cylinder id="floor" position="0 0 0" radius="7.5" color="#7A5C58" height="0.1"></a-cynlinder>
         <!-- Museum walls starts here -->
            <a-box id="box1" position="0 1.473 4.907" rotation="0 0 0" scale="10 3 0.2" color="#7A5C58"></a-box>
         <a-box id="box1" position="0 1.473 -4.907" rotation="0 0 0" scale="10 3 0.2" color="#7A5C58"></a-box>
         <a-box id="box1" position="5.049 1.454 -0.008" rotation="0 -90 0" scale="10 3 0.2" color="#7A5C58"></a-box>
         <a-box id="box1" position="-5.049 1.454 -0.008"rotation="0 -90 0" scale="10 3 0.2" color="#7A5C58"></a-box>
          <!-- Museum roof starts here -->
         <a-cylinder id="triangle_front" segments-radial="3" position="0 3.874 4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="#7A5C58"></a-cylinder>
         <a-cylinder id="triangle_back" segments-radial="3" position="0 3.874 -4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="#7A5C58"></a-cylinder>
         <a-box id="roof_right" position="2.580 4.328 0" rotation="28.433 90 0" scale="10.931 0.20 6.110" color="#7A5C58"></a-box>
         <a-box id="roof_right" position="-2.580 4.328 -0.017" rotation="28.433 -90 0" scale="10.931 0.20 6.130" color="#7A5C58"></a-box>
          <!-- Museum pictures starts here -->
         <a-plane id="art1" src="images/bookheart.jpg" scale="2 2 0.05" rotation="0 0 0" position="-0.162 1.934 -4.792"></a-plane>
         <a-plane id="art2" src="images/Skyy.jpeg" scale="2 2 0.05" rotation="0 90 0" position="-4.928 1.619 0.290"></a-plane>
         <a-plane id="art3" src="images/People.jpeg" scale="2 2 0.05" rotation="0 90 0" position="-4.928 1.619 3.575"></a-plane>
         <a-obj-model id="3dModel1" src="images/tinker.obj" mtl="images/obj.mtl" position="0 0 0" rotation="-90 0 0" scale="0.009 0.009 0.009"></a-obj-model>
         <a-entity>

  <a-video src="#videoclip" position="-3.893 1.6 0" rotation="0 90 0" width="2" height="1.125"></a-video>

  <!-- TV background -->

  <a-plane id="videoControls" position="-3.893 0.854 0" scale="2 0.386 1.714" rotation="0 90 0" opacity="1" src="#tv_background">

    <!-- Play button -->

    <a-plane id="vidplaybox" src="#play" scale="0.122 0.678 0.122" position="-0.350 0 .01" shader="flat" transparent="true" videoplayer></a-plane>

    <!-- Stop button -->

    <a-plane id="vidpausebox" src="#pause" scale="0.122 0.678 0.122" position="0.350 0 .01" shader="flat" transparent="true" videopauser></a-plane>

  </a-plane>

</a-entity>

<!-- Allows clicking with the mouse -->

<a-entity cursor="rayOrigin: mouse"></a-entity>
        </a-scene>
          <!-- Video -->

  <video id="videoclip" loop="true" src="tvAssets/" crossorigin="anonymous" preload="auto"></video>

  <!-- Buttons and Background -->

  <img id="play" src="tvAssets/btnPlay.png" preload="auto">

  <img id="pause" src="tvAssets/btnPause.png" preload="auto">

  <img id="tv_background" src="tvAssets/tv_background.jpg" preload="auto">
        <a-assets></a-assets>
</body>
</html>
